# Installs JS deps in the cloud and commits pnpm-lock.yaml plus Prettier fixes back to the branch.
# Use it when the lockfile needs (re)generating and the local network is too slow to do it.
name: Bootstrap lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - pnpm-workspace.yaml

permissions:
  contents: write
  actions: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No lockfile yet, so the automatic pnpm cache would fail.
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: update pnpm-lock.yaml and formatting"
            git push
          fi
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start CI explicitly.
      - name: Run CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
