name: AI check

# Manual: lists each provider's models and calls every configured model once with a tiny
# prompt, from a US server (Gemini is blocked from some countries).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Web check with only these providers, e.g. groq (empty = all), to test a backup"
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Models each provider offers
        run: uv run python -m jobbuddy_workers.llm.list_models || true
      - name: Call every configured model
        run: uv run python -m jobbuddy_workers.llm.smoke

  web:
    name: Tailoring and answers (real models)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ (inputs.only == '' || contains(inputs.only, 'gemini')) && secrets.GEMINI_API_KEY || '' }}
      GROQ_API_KEY: ${{ (inputs.only == '' || contains(inputs.only, 'groq')) && secrets.GROQ_API_KEY || '' }}
      CEREBRAS_API_KEY: ${{ (inputs.only == '' || contains(inputs.only, 'cerebras')) && secrets.CEREBRAS_API_KEY || '' }}
      MISTRAL_API_KEY: ${{ (inputs.only == '' || contains(inputs.only, 'mistral')) && secrets.MISTRAL_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ (inputs.only == '' || contains(inputs.only, 'openrouter')) && secrets.OPENROUTER_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tailor a sample CV and draft answers
        working-directory: apps/web
        run: pnpm exec vitest run --config vitest.ai.config.ts --reporter=verbose
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-check-output
          path: apps/web/ai-check-output
