name: Seed companies

# Checks every candidate company in workers/src/jobbuddy_workers/seed/candidates.py and
# inserts the ones whose job board is live. Safe to re-run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report, don't insert"
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run jobbuddy-workers seed-companies ${{ inputs.dry_run && '--dry-run' || '' }}
