name: Fetch jobs

on:
  schedule:
    - cron: "7 */2 * * *" # every 2 hours
  workflow_dispatch:
    inputs:
      source:
        description: "Only this source (empty = all that are due)"
        required: false

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: workers
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      REED_API_KEY: ${{ secrets.REED_API_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-all-MiniLM-L6-v2
      - run: uv sync --locked --no-dev
      - name: Fetch
        # Own limit, so a slow source can never stop matching from running.
        timeout-minutes: 35
        run: |
          if [ -n "${{ inputs.source }}" ]; then
            uv run jobbuddy-workers fetch --source "${{ inputs.source }}"
          else
            uv run jobbuddy-workers fetch
          fi
      - name: Match
        # Scores new or changed jobs for every user right after fetching.
        if: ${{ !cancelled() }}
        run: uv run jobbuddy-workers match
