name: Check apply links

# Manual: opens a few stored jobs from each job board, follows "Apply" and reports where it
# leads and whether the page asks for payment or an account. Never submits anything.
on:
  workflow_dispatch:
    inputs:
      boards:
        description: "Comma-separated sources (empty = all)"
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BOARDS: ${{ inputs.boards || 'himalayas,jobicy,weworkremotely,workingnomads,remotive,arbeitnow,adzuna,reed,jooble,hackernews' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter web
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Check
        working-directory: apps/web
        run: node scripts/check-apply-links.mjs
