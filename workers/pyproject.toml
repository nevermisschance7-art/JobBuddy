[project]
name = "jobbuddy-workers"
version = "0.0.0"
description = "JobBuddy background workers: job fetchers, matcher, company discovery"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[project.scripts]
jobbuddy-workers = "jobbuddy_workers.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbuddy_workers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
