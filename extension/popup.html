<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JobBuddy</title>
    <style>
      body {
        font:
          14px/1.4 system-ui,
          sans-serif;
        width: 290px;
        margin: 0;
        padding: 14px 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      a {
        color: #4f46e5;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 8px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        font: inherit;
      }
      button {
        margin-top: 8px;
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      .muted {
        color: #78716c;
        font-size: 12px;
      }
      .err {
        color: #b91c1c;
        font-size: 12px;
      }
      .big {
        font-size: 28px;
        font-weight: 700;
        margin: 8px 0 0;
      }
      .mascot {
        display: flex;
        gap: 8px;
        align-items: center;
        background: #f5f5f4;
        border-radius: 10px;
        padding: 8px;
      }
      .mascot span {
        font-size: 24px;
      }
      .mascot p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>JobBuddy</h1>
    <div id="root"></div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
