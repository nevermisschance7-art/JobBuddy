<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JobBuddy</title>
    <style>
      body {
        font:
          13px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        width: 310px;
        margin: 0;
        color: #1c1b22;
        background: #f7f7fb;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: #4f46e5;
        color: #fff;
        font-weight: 700;
        font-size: 15px;
      }
      main {
        padding: 14px 16px 12px;
      }
      .alerts {
        margin-top: 10px;
        border: 1px solid #dcdce6;
        border-radius: 10px;
        background: #fff;
      }
      .alerts p {
        margin: 0;
        padding: 8px 10px;
        border-top: 1px solid #ececf3;
      }
      .alerts p:first-child {
        border-top: 0;
      }
      .alerts b {
        display: block;
      }
      a {
        color: #4f46e5;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #dcdce6;
        border-radius: 10px;
        font: inherit;
        background: #fff;
      }
      button.primary {
        margin-top: 10px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 10px;
        background: #4f46e5;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button.primary:hover {
        background: #4338ca;
      }
      button:disabled {
        opacity: 0.6;
      }
      .lead {
        margin-top: 0;
      }
      .muted {
        color: #6b6b80;
        font-size: 12px;
      }
      .center {
        text-align: center;
      }
      .err {
        color: #b91c1c;
        font-size: 12px;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .stat {
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid #e8e8f0;
        border-radius: 12px;
        padding: 10px 12px;
        text-decoration: none;
        color: inherit;
      }
      .stat:hover {
        border-color: #4f46e5;
      }
      .stat b {
        font-size: 24px;
        color: #4f46e5;
      }
      .stat span {
        color: #6b6b80;
        font-size: 11px;
      }
      .links {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #e8e8f0;
        padding-top: 10px;
        margin-top: 4px;
      }
      .links a {
        text-decoration: none;
        font-weight: 600;
      }
      .mascot {
        display: flex;
        gap: 8px;
        align-items: center;
        background: #fff;
        border: 1px solid #e8e8f0;
        border-radius: 12px;
        padding: 8px 10px;
        margin-top: 12px;
      }
      .mascot span {
        font-size: 22px;
      }
      .mascot p {
        margin: 0;
      }
      .foot {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <header><img src="/icon-48.png" width="22" height="22" alt="" /> JobBuddy</header>
    <main id="root"></main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
