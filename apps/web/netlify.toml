# Netlify builds and serves the Next.js app (OpenNext runtime is added automatically).
# Deploys run only from the manual "Deploy web" GitHub workflow, never on every push,
# because each production deploy costs Netlify credits.

# The CLI runs from the repo root (pnpm monorepo), so paths are root-relative.
[build]
  command = "pnpm --filter web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
